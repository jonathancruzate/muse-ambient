plugins { id 'com.android.application' }
android {
    namespace 'com.jonathancruzate.museambient'
    // Available fleet SDK is Android 11 / API 30, which exactly matches the
    // target Shield TV. Raise to 34 when an API-34 platform jar is installed.
    compileSdk 30
    defaultConfig {
        applicationId 'com.jonathancruzate.museambient'
        minSdk 26
        targetSdk 30
        versionCode 14
        versionName '0.4.3'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { /* framework only, deliberately no AndroidX / Compose */ }
